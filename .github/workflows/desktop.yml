name: Desktop app

# Builds installers for macOS (.dmg), Windows (.exe) and Linux (.AppImage).
# Download them from the run's "Artifacts" section. Pushing a tag like v0.1.0
# also publishes them as a GitHub Release.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - name: Windows
            os: windows-latest
            script: dist:win
            files: release/*.exe
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
            files: release/*.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # No paid signing certificates: macOS gets an ad-hoc signature, Windows is unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Synapse-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
